# Extracto de /etc/squid/squid.conf 

# ACLs básicas
acl localnet src 192.168.100.0/24          # Red LAN
acl Safe_ports port 80                     # HTTP
acl Safe_ports port 443                    # HTTPS
acl Safe_ports port 21                     # FTP (si se usa)
acl CONNECT method CONNECT

# Reglas de acceso básicas
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access allow localhost
http_access deny all

# Puerto del proxy
http_port 3128

# ACLs avanzadas (Repte 2)
acl director src 192.168.100.10
acl administratius src 192.168.100.20
acl worktime time MTWHF 09:00-13:00
acl worktime2 time MTWHF 14:00-18:00
acl pausetime time MTWHF 13:00-14:00
acl webs_permeses dstdomain "/etc/squid/webs_permeses"
acl webs_prohibides dstdomain "/etc/squid/webs_prohibides"

# Reglas ACLs por usuario/horario
http_access allow director
http_access allow administratius pausetime webs_permeses
http_access deny administratius worktime webs_prohibides
http_access deny administratius worktime2 webs_prohibides
http_access allow administratius worktime
http_access allow administratius worktime2
http_access deny administratius

# Logs (para SARG)
access_log daemon:/var/log/squid/access.log squid
