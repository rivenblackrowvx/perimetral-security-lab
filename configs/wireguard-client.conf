# Ejemplo de /etc/wireguard/wg0.conf (cliente Fedora)

[Interface]
PrivateKey = <TU_CLAVE_PRIVADA_AQUI>
Address = 10.8.0.2/24
DNS = 8.8.8.8, 1.1.1.1

[Peer]
PublicKey = <CLAVE_PUBLICA_OPNSENSE_AQUI>
PresharedKey = <CLAVE_PRESHARED_AQUI>
Endpoint = 10.0.2.15:51820
AllowedIPs = 10.8.0.0/24, 192.168.100.0/24, 192.168.200.0/24
PersistentKeepalive = 25
